<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeepKeep – Downloader &amp; Anonymous Story Viewer for Instagram</title>
  <meta name="description" content="KeepKeep – Downloader &amp; Anonymous Story Viewer for Instagram: save Instagram profiles and posts to your own lists, download photos and videos in full quality, and watch stories anonymously.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    :root { --bg: #ffffff; --text: #1d1321; --muted: #6b6172; --brand: #8119b5; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #120a16; --text: #f3eef6; --muted: #b3a8ba; --brand: #c07fe0; }
    }
    :root[data-theme="dark"] { --bg: #120a16; --text: #f3eef6; --muted: #b3a8ba; --brand: #c07fe0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 400 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }
    main { max-width: 1152px; margin: 0 auto; padding: 56px 16px 72px; text-align: center; }
    .intro { max-width: 560px; margin: 0 auto; }
    .hero { display: block; width: 100%; height: auto; max-width: 1120px; margin: 40px auto 0; border-radius: 18px; box-shadow: 0 20px 50px rgba(69, 11, 98, 0.25); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 24px; margin-top: 32px; }
    .gallery img { width: 100%; height: auto; border-radius: 14px; box-shadow: 0 12px 32px rgba(69, 11, 98, 0.18); }
    .logo { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(69, 11, 98, 0.3); }
    h1 { font-size: 40px; letter-spacing: -0.02em; margin: 20px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    nav { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    a { color: var(--brand); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="intro">
    <img class="logo" src="logo.svg" alt="KeepKeep logo">
    <h1>KeepKeep</h1>
    <p>Save Instagram profiles and posts to your own lists, download photos and videos in full quality, and watch stories anonymously. Everything stays in your browser.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="https://github.com/hakanoktay/keepkeep/issues">Support</a>
    </nav>
    </div>
    <img class="hero" src="images/promo-marquee-1400x560.png" alt="KeepKeep: keep what you find on Instagram" width="1400" height="560">
    <div class="gallery">
      <img src="images/screenshot-1-keep.png" alt="Save posts and profiles and pick a list right away" width="1280" height="800" loading="lazy">
      <img src="images/screenshot-2-lists.png" alt="Your own lists for profiles and posts" width="1280" height="800" loading="lazy">
      <img src="images/screenshot-3-download.png" alt="Download every photo and video in full quality" width="1280" height="800" loading="lazy">
      <img src="images/screenshot-4-anonymous.png" alt="Watch stories anonymously" width="1280" height="800" loading="lazy">
      <img src="images/screenshot-5-video.png" alt="Skip through any video" width="1280" height="800" loading="lazy">
    </div>
  </main>
</body>
</html>
